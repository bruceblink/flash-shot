name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v<major>.<minor>.<patch> tag to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify release tag
        shell: pwsh
        run: .\scripts\verify-release-tag.ps1 -Tag "${{ inputs.tag || github.ref_name }}"
      - name: Validate source
        shell: pwsh
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes
      - name: Build release executable
        shell: pwsh
        run: cargo build --release --bin flash-shot --target x86_64-pc-windows-msvc
      - name: Build signed release assets
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: .\scripts\package-github-release.ps1 -SkipBuild
      - name: Smoke test portable startup
        shell: pwsh
        run: |
          $portable = Get-ChildItem -LiteralPath dist -Filter "FlashShot-*-windows-*.zip" -File
          if ($portable.Count -ne 1) {
            throw "Expected exactly one portable release archive, found $($portable.Count)."
          }
          .\scripts\smoke-portable-startup.ps1 -ArchivePath $portable.FullName
      - name: Smoke test installer lifecycle
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath dist -Filter "FlashShot-*-windows-setup.exe" -File
          if ($installer.Count -ne 1) {
            throw "Expected exactly one installer, found $($installer.Count)."
          }
          .\scripts\smoke-installer.ps1 -InstallerPath $installer.FullName -RequireSignature
      - name: Generate release manifest
        shell: pwsh
        run: |
          .\scripts\release-manifest.ps1 -AssetDirectory dist
          .\scripts\release-manifest.ps1 -AssetDirectory dist -VerifyOnly
          .\scripts\verify-release-assets.ps1 -AssetDirectory dist -SkipStartupSmoke -RequireSignature
      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*.exe
            dist/*.exe.sha256
            dist/release-manifest.json
