name: CI

on:
  push:
    branches: [main]
    # Documentation, editor metadata, and repository administration files do
    # not change the Rust build or its release/package checks.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - '.idea/**'
      - '.vscode/**'
      - '.github/CODEOWNERS'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
      - '.github/dependabot.yml'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - '.idea/**'
      - '.vscode/**'
      - '.github/CODEOWNERS'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
      - '.github/dependabot.yml'

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: .\scripts\package-installer.ps1 -ValidateOnly
      - run: .\scripts\test-fetch-inno-language.ps1
      - run: .\scripts\test-package-installer.ps1
      - run: .\scripts\test-portable-package.ps1
      - run: .\scripts\test-release-manifest.ps1
      - run: .\scripts\test-release-tag.ps1
      - run: .\scripts\test-verify-release-assets.ps1
      - run: .\scripts\test-verify-github-release.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python .github/scripts/test_generate_release_notes.py
