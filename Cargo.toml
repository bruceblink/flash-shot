[workspace]
resolver = "3"
members = [
    "crates/flash-shot-domain",
    "crates/flash-shot-app",
    "crates/flash-shot-bin",
]
default-members = ["crates/flash-shot-bin"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
repository = "ssh://git@github.com/bruceblink/flash-shot.git"
license = "AGPL-3.0-only"

[workspace.dependencies]
flash-shot-domain = { path = "crates/flash-shot-domain" }
flash-shot-app = { path = "crates/flash-shot-app" }
async-channel = "2.5"
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
directories = "6.0"
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed" }
gpui = { git = "https://github.com/zed-industries/zed", rev = "819fe337999551ce8177b14c8db1127645617ae4" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "819fe337999551ce8177b14c8db1127645617ae4", features = ["font-kit"] }
image = { version = "0.25.1", default-features = false, features = ["jpeg", "webp"] }
log = { version = "0.4.28", features = ["std"] }
mimalloc = "0.1.48"
pathfinder_geometry = "0.5"
png = "0.18"
qrcode = { version = "0.14", default-features = false }
raw-window-handle = "0.6"
rqrr = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.53", features = ["full"] }
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
uuid = { version = "1.24", features = ["v7"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Performance", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"
winres = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
